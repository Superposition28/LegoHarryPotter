# LEGO Harry Potter Operations Manifest
# Placeholders: Game_Root, Project_Root are built into the engine

title = "LEGO Harry Potter Operations"

## Downloads the tools listed in Tools.toml
[[operation]]
id = -1
name = "Download Required Tools"
run-all = true
depends-on = []
script_type = "engine"
script = "download-tools"
tools_manifest = "{{Game_Root}}/Tools.toml"

# Extracts PS3 retail disc image (.iso) if present in Source/Orginals/PS3
[[operation]]
id = 3
name = "Extract ISO Disc Image - LEGO Harry Potter (PS3)"
run-all = false
depends-on = []
script_type = "engine"
script = "format-extract"
format = "iso"
input = "{{Game_Root}}/Source/Orginals/PS3"
output = "{{Game_Root}}/Source/Orginals/PS3"

# Extracts Xbox 360 retail disc image (.iso) if present in Source/Orginals/Xbox_360
[[operation]]
id = 4
name = "Extract ISO Disc Image - LEGO Harry Potter (Xbox 360)"
run-all = false
depends-on = []
script_type = "engine"
script = "format-extract"
format = "iso"
input = "{{Game_Root}}/Source/Orginals/Xbox_360"
output = "{{Game_Root}}/Source/Orginals/Xbox_360"

# Extracts all PakDat v1.01 (.DAT) archives from the PS3 builds of LEGO Harry Potter
[[operation]]
id = 1
name = "Extract Archives (.DAT) - LEGO Harry Potter (PS3)"
run-all = true
depends-on = [-1]
script_type = "bms"
script = "{{Game_Root}}/operations/lhp_dat.bms"
input = "{{Game_Root}}/Source/Orginals/PS3"
output = "{{Game_Root}}/GameFiles/LHP-PS3"
extension = ".dat"

# Cross-reference inventory covers the console originals and Windows Collection.
[[operation]]
id = 10
name = "Inventory TT archive formats"
run-all = false
depends-on = []
script_type = "lua"
script = "{{Game_Root}}/operations/CrossReference.lua"

[[operation]]
id = 11
name = "Extract Windows Collection archives"
run-all = false
depends-on = [-1]
script_type = "lua"
script = "{{Game_Root}}/operations/CrossReference.lua"
args = ["--extract"]

[[operation]]
id = 12
name = "Inspect Collection launcher and supplied Xbox demo containers"
run-all = false
depends-on = []
script_type = "lua"
script = "{{Game_Root}}/operations/InspectContainers.lua"

[[operation]]
id = 13
name = "Extract Collection launcher and supplied Xbox demo archives"
run-all = false
depends-on = [-1]
script_type = "lua"
script = "{{Game_Root}}/operations/InspectContainers.lua"
args = ["--extract"]

[[operation]]
id = 14
name = "Compare exported TT format inventories"
run-all = false
depends-on = [-1]
script_type = "lua"
script = "{{Game_Root}}/operations/CompareFormats.lua"

[[operation]]
id = 15
name = "Validate TT archive parser with synthetic inputs"
run-all = false
depends-on = []
script_type = "lua"
script = "{{Game_Root}}/operations/ValidateArchiveParser.lua"

# Extracts all PakDat v1.01 (.DAT) archives from the Xbox 360 builds of LEGO Harry Potter
[[operation]]
id = 2
name = "Extract Archives (.DAT) - LEGO Harry Potter (Xbox 360)"
run-all = true
depends-on = [-1]
script_type = "bms"
script = "{{Game_Root}}/operations/lhp_dat.bms"
input = "{{Game_Root}}/Source/Orginals/Xbox_360"
output = "{{Game_Root}}/GameFiles/LHP-XBOX"
extension = ".dat"
